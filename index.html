    .download-icon {

      height: 64px;

      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: rgba(108, 212, 240, 0.08);

    .download-icon svg {
      width: 30px;
      height: 30px;
    }

    .frost-card h1 {
      margin: 0;

      color: #eef7fb;

      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 12px 0 0;

      color: #93aebd;

      font-size: 14px;
      line-height: 1.6;
    }

    .preparing {
      margin-top: 30px;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 0 auto 15px;

      border: 3px solid rgba(108, 212, 240, 0.15);
      border-top-color: #6cd4f0;

      border-radius: 50%;

      animation: frost-spin 0.8s linear infinite;
    }

    @keyframes frost-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .prepare-text {
      color: #93aebd;
      font-size: 14px;
    }

    .prepare-text strong {
      color: #6cd4f0;
      margin-left: 5px;
    }

    .progress {
      width: 100%;
      height: 5px;

      margin-top: 18px;

      overflow: hidden;

      border-radius: 100px;

      background: rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: 100px;

      background: #6cd4f0;

      transition: width 0.2s linear;
    }

    .ready {
      display: none;
      margin-top: 28px;
    }

    .timer-text {
      margin-bottom: 20px;

      color: #93aebd;

      font-size: 13px;
    }

    .timer-text strong {
      color: #6cd4f0;
      margin-left: 5px;
    }

    .trust-row {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 14px;

      margin-top: 28px;

      color: #5c7382;

    }

    .footnote {
      margin-top: 24px;

      color: #5c7382;

      font-size: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .lander-frost-page {

        max-width: 560px;
        padding: 40px 24px;
        border-radius: 20px;
      }

      .frost-card h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13px;
      }
    }

  <script>
    (function () {
      "use strict";

      var preparing = document.getElementById("preparing");
      var ready = document.getElementById("ready");
      var countdown = document.getElementById("countdown");
      var progressBar = document.getElementById("progressBar");
      var timer = document.getElementById("timer");

      var total = 3;
      var remaining = total;

      countdown.textContent = remaining;

      if (progressBar) {
        progressBar.style.width = "0%";
      }

      var preparationTimer = setInterval(function () {

        remaining--;

        countdown.textContent = remaining;

        if (progressBar) {
          var percent =
            ((total - remaining) / total) * 100;

          progressBar.style.width =
            percent + "%";
        }

        if (remaining <= 0) {

          clearInterval(preparationTimer);

          preparing.style.display = "none";
          ready.style.display = "block";

          startTimer();
        }

      }, 1000);


      function startTimer() {

        var secondsLeft = 300;

        function updateTimer() {

          var minutes =
            Math.floor(secondsLeft / 60);

          var seconds =
            secondsLeft % 60;

          if (timer) {

            timer.textContent =
              String(minutes).padStart(2, "0") +
              ":" +
              String(seconds).padStart(2, "0");
          }

          if (secondsLeft <= 0) {

            clearInterval(expirationTimer);

            return;
          }

          secondsLeft--;
        }

        updateTimer();

        var expirationTimer =
          setInterval(updateTimer, 1000);
      }

    })();
